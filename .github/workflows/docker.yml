name: Reusable Docker Pack and Push

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Назва Docker-репозиторію'
        required: true
        type: string
      image_tag:
        description: 'Тег Docker-образу'
        required: true
        type: string
        default: 'latest'
      is_main_branch:
        description: 'Чи це головна гілка'
        required: true
        type: boolean
    secrets:
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_TOKEN:
        required: true

jobs:
  docker-pack-n-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: inputs.is_main_branch == true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ inputs.image_name }}:${{ inputs.image_tag }}

      - name: Push to Docker Hub (Main branch only)
        if: inputs.is_main_branch == true
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ inputs.image_name }}:${{ inputs.image_tag }}

      - name: Save image as artifact (Non-main branches)
        if: inputs.is_main_branch == false
        run: |
          mkdir -p /tmp/docker-images
          docker save ${{ inputs.image_name }}:${{ inputs.image_tag }} -o /tmp/docker-images/image.tar

      - name: Upload artifact
        if: inputs.is_main_branch == false
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/docker-images/image.tar
