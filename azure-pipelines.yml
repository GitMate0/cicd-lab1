trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'dockerhub-conn' # назва вашого Service Connection
  imageRepository: 'gitmate0/lab1-fastapi-crud'

stages:

  # -----------------------------------------------------------------
  # Stage a: Збирання проєкту (Перевірка залежностей)
  # -----------------------------------------------------------------
  - stage: Build
    displayName: 'a. Збирання проєкту'
    jobs:
      - job: BuildJob
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'

          - script: |
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.local/bin"
              uv pip install --system -r requirements.txt
            displayName: 'Перевірка залежностей через uv'

  # -----------------------------------------------------------------
  # Stage b: Запуск unit-тестів
  # -----------------------------------------------------------------
  - stage: Test
    displayName: 'b. Запуск unit-тестів'
    dependsOn: Build
    jobs:
      - job: TestJob
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'

          - script: |
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.local/bin"
              uv pip install --system -r requirements.txt pytest pytest-cov
              uv run pytest --junitxml=test-results.xml
            displayName: 'Запуск pytest'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: '**/test-results.xml'

  # -----------------------------------------------------------------
  # Stage c: Збирання Docker-образу та збереження його в Артефакти
  # -----------------------------------------------------------------
  - stage: DockerBuild
    displayName: 'c. Збирання Docker-образу'
    dependsOn: Test
    jobs:
      - job: DockerBuildJob
        steps:
          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              command: 'build'
              repository: '$(imageRepository)'
              dockerfile: '**/Dockerfile'
              tags: '$(Build.BuildId)'

          # Зберігаємо образ у tar-архів
          - script: |
              mkdir -p $(Pipeline.Workspace)/docker-image
              docker save $(imageRepository):$(Build.BuildId) -o $(Pipeline.Workspace)/docker-image/image.tar
            displayName: 'Збереження Docker-образу у файл .tar'

          # Передаємо файл образу між стейджами Azure DevOps
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Pipeline.Workspace)/docker-image'
              artifact: 'docker-image'
            displayName: 'Публікація артефакту Docker-образу'

  # -----------------------------------------------------------------
  # Stage d: Присвоєння Docker-образу додаткових тегів
  # -----------------------------------------------------------------
  - stage: DockerTag
    displayName: 'd. Присвоєння Docker-образу тегів'
    dependsOn: DockerBuild
    jobs:
      - job: DockerTagJob
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: 'current'
              artifactName: 'docker-image'
              targetPath: '$(Pipeline.Workspace)/docker-image'
            displayName: 'Завантаження збереженого Docker-образу'

          - script: |
              docker load -i $(Pipeline.Workspace)/docker-image/image.tar
              docker tag $(imageRepository):$(Build.BuildId) $(imageRepository):latest
              docker tag $(imageRepository):$(Build.BuildId) $(imageRepository):v1.0
            displayName: 'Присвоєння тегів latest та v1.0'

          # Перезберігаємо образ із новими тегами для наступного етапу
          - script: |
              docker save $(imageRepository):$(Build.BuildId) $(imageRepository):latest $(imageRepository):v1.0 -o $(Pipeline.Workspace)/docker-image/tagged-image.tar
            displayName: 'Збереження протегованих образів'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Pipeline.Workspace)/docker-image/tagged-image.tar'
              artifact: 'tagged-docker-image'
            displayName: 'Публікація артефакту протегованого образу'

  # -----------------------------------------------------------------
  # Stage e: Публікація Docker-образу в Docker Hub
  # -----------------------------------------------------------------
  - stage: DockerPush
    displayName: 'e. Публікація Docker-образу в Docker Hub'
    dependsOn: DockerTag
    jobs:
      - job: DockerPushJob
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: 'current'
              artifactName: 'tagged-docker-image'
              targetPath: '$(Pipeline.Workspace)/docker-image'
            displayName: 'Завантаження протегованого образу'

          - script: |
              docker load -i $(Pipeline.Workspace)/docker-image/tagged-image.tar
            displayName: 'Завантаження образів у Docker Daemon'

          - task: Docker@2
            displayName: 'Авторизація та Push в Docker Hub'
            inputs:
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: '$(imageRepository)'
              command: 'push'
              tags: |
                $(Build.BuildId)
                latest
                v1.0